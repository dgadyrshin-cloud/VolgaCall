<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Волга Брик — РОП Тукая</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
    <script src="https://cdn.sheetjs.com/xlsx-0.20.1/package/dist/xlsx.full.min.js"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: { sans: ['Inter', 'ui-sans-serif', 'system-ui', '-apple-system', 'sans-serif'] },
                    colors: {
                        primary: { DEFAULT: "#03c871", foreground: "#ffffff" },
                        destructive: { DEFAULT: "#c62828", foreground: "#ffffff" },
                        muted: { DEFAULT: "#f4f4f5", foreground: "#71717a" },
                        card: { DEFAULT: "#ffffff", foreground: "#09090b" },
                        border: "#e4e4e7",
                        ring: "#03c871",
                    }
                }
            }
        }
    </script>
</head>
<body class="bg-gray-50 min-h-screen font-sans antialiased">
    <div id="password-overlay" class="fixed inset-0 bg-black/50 flex items-center justify-center z-50">
        <div class="bg-card border rounded-xl shadow-lg p-6 w-80 text-center">
            <h2 class="text-lg font-semibold mb-4 flex items-center justify-center gap-2"><i data-lucide="lock" class="h-5 w-5"></i> РОП Тукая</h2>
            <input type="password" id="password-input" placeholder="Введите пароль" class="flex h-9 w-full rounded-md border border-input bg-background px-3 py-1 text-sm mb-3 focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-ring">
            <button id="password-submit" class="inline-flex items-center justify-center rounded-md bg-primary text-primary-foreground hover:bg-primary/90 h-9 px-4 text-sm font-medium w-full transition-colors">Войти</button>
            <div id="password-error" class="text-destructive text-sm mt-2"></div>
        </div>
    </div>

    <div id="dashboard-content" style="display:none;" class="max-w-6xl mx-auto p-6">
        <div class="flex items-center justify-between mb-6">
            <h1 class="text-2xl font-semibold flex items-center gap-2"><i data-lucide="users" class="h-6 w-6 text-primary"></i> РОП Тукая — Статистика</h1>
            <div class="flex items-center gap-2">
                <button onclick="location.reload()" class="inline-flex items-center rounded-md border border-input bg-background hover:bg-muted/50 h-9 px-3 text-sm font-medium transition-colors"><i data-lucide="refresh-cw" class="h-4 w-4 mr-1"></i> Обновить</button>
                <button onclick="exportExcel()" class="inline-flex items-center rounded-md bg-primary text-primary-foreground hover:bg-primary/90 h-9 px-3 text-sm font-medium transition-colors"><i data-lucide="download" class="h-4 w-4 mr-1"></i> Excel</button>
                <span id="update-time" class="text-sm text-muted-foreground ml-2"></span>
            </div>
        </div>

        <!-- Фильтры (отдел фиксирован) -->
        <div class="bg-card border rounded-xl p-4 mb-6">
            <div class="flex flex-wrap items-end gap-3">
                <div>
                    <label class="text-xs font-medium text-muted-foreground block mb-1">Менеджер</label>
                    <select id="filter-manager" class="flex h-9 rounded-md border border-input bg-background px-3 py-1 text-sm focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-ring w-48">
                        <option value="">Все (Тукая)</option>
                        <option>Артем</option><option>Руслан</option><option>Алия</option><option>Айнур</option>
                    </select>
                </div>
                <div>
                    <label class="text-xs font-medium text-muted-foreground block mb-1">Период с</label>
                    <input type="date" id="filter-date-from" class="flex h-9 rounded-md border border-input bg-background px-3 py-1 text-sm focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-ring w-40">
                </div>
                <div>
                    <label class="text-xs font-medium text-muted-foreground block mb-1">Период по</label>
                    <input type="date" id="filter-date-to" class="flex h-9 rounded-md border border-input bg-background px-3 py-1 text-sm focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-ring w-40">
                </div>
                <button id="btn-reset-filters" class="inline-flex items-center rounded-md border border-input bg-background hover:bg-muted/50 h-9 px-3 text-sm font-medium transition-colors">
                    <i data-lucide="x" class="h-4 w-4 mr-1"></i> Сбросить
                </button>
            </div>
        </div>

        <div class="grid grid-cols-2 md:grid-cols-4 gap-4 mb-6">
            <div class="bg-card border rounded-xl p-4 text-center"><h3 class="text-xs text-muted-foreground uppercase">Всего звонков</h3><div class="text-2xl font-bold" id="total">0</div></div>
            <div class="bg-card border rounded-xl p-4 text-center"><h3 class="text-xs text-muted-foreground uppercase">Интересно</h3><div class="text-2xl font-bold text-emerald-600" id="yes">0</div></div>
            <div class="bg-card border rounded-xl p-4 text-center"><h3 class="text-xs text-muted-foreground uppercase">Покупают</h3><div class="text-2xl font-bold text-blue-600" id="buy">0</div></div>
            <div class="bg-card border rounded-xl p-4 text-center"><h3 class="text-xs text-muted-foreground uppercase">Не интересно</h3><div class="text-2xl font-bold text-destructive" id="no">0</div></div>
        </div>
        <div class="bg-card border rounded-xl p-4 mb-4">
            <h2 class="text-lg font-semibold mb-3">👥 Мои менеджеры</h2>
            <div class="overflow-x-auto"><table class="w-full text-sm"><thead><tr class="border-b bg-muted/50"><th class="text-left py-2 px-3 font-medium">Менеджер</th><th class="text-center py-2 px-3">Всего</th><th class="text-center py-2 px-3">✅ Интересно</th><th class="text-center py-2 px-3">🛒 Покупают</th><th class="text-center py-2 px-3">❌ Не интересно</th><th class="text-center py-2 px-3">Конверсия</th></tr></thead><tbody id="by-manager"></tbody></table></div>
        </div>
        <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
            <div class="bg-card border rounded-xl p-4"><h2 class="text-lg font-semibold mb-3">🚫 Причины отказов</h2><div id="by-reason" class="text-sm"></div></div>
            <div class="bg-card border rounded-xl p-4"><h2 class="text-lg font-semibold mb-3">📋 Последние 20 звонков</h2><div id="recent" class="text-sm overflow-x-auto"></div></div>
        </div>
    </div>
    <script>
        const firebaseConfig = { apiKey: "AIzaSyC-YD6qkyRFo3xQTLkX68Tqx7xMb-ojNiM", authDomain: "volgabrick-f2260.firebaseapp.com", projectId: "volgabrick-f2260", storageBucket: "volgabrick-f2260.firebasestorage.app", messagingSenderId: "608686730576", appId: "1:608686730576:web:002b653cb7ffa7b3381055" };
        firebase.initializeApp(firebaseConfig); const db = firebase.database();
        const CORRECT_PASSWORD = '1234'; const MY_MANAGERS = ['Артем', 'Руслан', 'Алия', 'Айнур'];
        if (sessionStorage.getItem('rop_tukaya_auth') === 'true') showDashboard();
        document.getElementById('password-submit').addEventListener('click', checkPassword);
        document.getElementById('password-input').addEventListener('keydown', e => { if (e.key === 'Enter') checkPassword(); });
        function checkPassword() {
            if (document.getElementById('password-input').value === CORRECT_PASSWORD) { sessionStorage.setItem('rop_tukaya_auth', 'true'); showDashboard(); }
            else { document.getElementById('password-error').textContent = '❌ Неверный пароль'; document.getElementById('password-input').value = ''; }
        }
        function showDashboard() { document.getElementById('password-overlay').style.display = 'none'; document.getElementById('dashboard-content').style.display = 'block'; lucide.createIcons(); initDashboard(); }
        let allData = [], filteredData = [];

        function applyFilters() {
            const mgr = document.getElementById('filter-manager').value;
            const dateFrom = document.getElementById('filter-date-from').value;
            const dateTo = document.getElementById('filter-date-to').value;
            filteredData = allData.filter(call => {
                if (mgr && call.manager !== mgr) return false;
                if (dateFrom || dateTo) {
                    const callDate = parseTimestamp(call.timestamp);
                    if (dateFrom && callDate < new Date(dateFrom)) return false;
                    if (dateTo) {
                        const toDate = new Date(dateTo);
                        toDate.setHours(23,59,59,999);
                        if (callDate > toDate) return false;
                    }
                }
                return true;
            });
            render();
        }
        function parseTimestamp(ts) {
            if (!ts) return new Date(0);
            const parts = ts.match(/(\d{2})\.(\d{2})\.(\d{4}) (\d{2}):(\d{2})/);
            if (parts) return new Date(+parts[3], +parts[2]-1, +parts[1], +parts[4], +parts[5]);
            return new Date(0);
        }
        function initDashboard() {
            db.ref('calls').on('value', snapshot => {
                const data = snapshot.val();
                allData = data ? Object.values(data).filter(c => MY_MANAGERS.includes(c.manager)) : [];
                applyFilters();
                localStorage.setItem('rop_tukaya_cache', JSON.stringify(allData));
                document.getElementById('update-time').textContent = '🟢 ' + new Date().toLocaleTimeString('ru-RU');
            }, err => { const cached = localStorage.getItem('rop_tukaya_cache'); if (cached) { allData = JSON.parse(cached); applyFilters(); } document.getElementById('update-time').textContent = '🔴 Офлайн'; });
            document.getElementById('filter-manager').addEventListener('change', applyFilters);
            document.getElementById('filter-date-from').addEventListener('change', applyFilters);
            document.getElementById('filter-date-to').addEventListener('change', applyFilters);
            document.getElementById('btn-reset-filters').addEventListener('click', () => {
                document.getElementById('filter-manager').value = '';
                document.getElementById('filter-date-from').value = '';
                document.getElementById('filter-date-to').value = '';
                applyFilters();
            });
        }
        function render() {
            const total = filteredData.length, interested = filteredData.filter(c => c.interest === 'интересно').length, buying = filteredData.filter(c => c.interest === 'покупают').length, notInterested = filteredData.filter(c => c.interest === 'не интересно').length;
            document.getElementById('total').textContent = total; document.getElementById('yes').textContent = interested; document.getElementById('buy').textContent = buying; document.getElementById('no').textContent = notInterested;
            const managers = {}; filteredData.forEach(c => { const m = c.manager; if (!managers[m]) managers[m] = { total:0, interested:0, buying:0, not:0 }; managers[m].total++; if (c.interest === 'интересно') managers[m].interested++; else if (c.interest === 'покупают') managers[m].buying++; else if (c.interest === 'не интересно') managers[m].not++; });
            let html = ''; Object.entries(managers).sort((a,b) => b[1].total - a[1].total).forEach(([name, s]) => { const c = s.total ? Math.round(((s.interested + s.buying) / s.total) * 100) : 0; html += `<tr class="border-b hover:bg-muted/30"><td class="py-2 px-3 font-medium">${name}</td><td class="text-center py-2">${s.total}</td><td class="text-center text-emerald-600">${s.interested}</td><td class="text-center text-blue-600">${s.buying}</td><td class="text-center text-destructive">${s.not}</td><td class="text-center">${c}%</td></tr>`; });
            document.getElementById('by-manager').innerHTML = html || '<tr><td colspan="6" class="text-center text-muted-foreground py-4">Нет данных</td></tr>';
            const reasons = {}; filteredData.filter(c => c.interest === 'не интересно').forEach(c => { const r = c.reason || 'Не указана'; reasons[r] = (reasons[r] || 0) + 1; });
            let rh = '<table class="w-full text-sm"><tr class="border-b bg-muted/50"><th class="text-left py-2 px-3">Причина</th><th class="text-center py-2 px-3">Кол-во</th><th class="text-center py-2 px-3">Доля</th></tr>';
            Object.entries(reasons).sort((a,b) => b[1] - a[1]).forEach(([r, cnt]) => { const share = notInterested ? Math.round((cnt / notInterested) * 100) : 0; rh += `<tr class="border-b"><td class="py-2 px-3">${r}</td><td class="text-center">${cnt}</td><td class="text-center">${share}%</td></tr>`; });
            rh += '</table>'; document.getElementById('by-reason').innerHTML = rh || '<p class="text-muted-foreground text-center py-2">Нет данных</p>';
            const recent = [...filteredData].reverse().slice(0, 20);
            let rth = '<table class="w-full text-sm"><tr class="border-b bg-muted/50"><th class="text-left py-2 px-3">Время</th><th class="text-left py-2 px-3">Менеджер</th><th class="text-left py-2 px-3">Клиент</th><th class="text-left py-2 px-3">Телефон</th><th class="text-left py-2 px-3">Результат</th></tr>';
            recent.forEach(c => { let result = c.interest === 'интересно' ? '✅ Интересно' : (c.interest === 'покупают' ? '🛒 Покупают' : '❌ ' + (c.reason || 'Не интересно')); rth += `<tr class="border-b hover:bg-muted/30"><td class="py-2 px-3 text-xs">${c.timestamp||''}</td><td class="py-2 px-3">${c.manager||''}</td><td class="py-2 px-3">${c.clientName||''}</td><td class="py-2 px-3">${c.phone||''}</td><td class="py-2 px-3">${result}</td></tr>`; });
            rth += '</table>'; document.getElementById('recent').innerHTML = rth || '<p class="text-muted-foreground text-center py-2">Нет данных</p>';
        }
        window.exportExcel = function() {
            if (!filteredData.length) { alert('Нет данных'); return; }
            const exp = filteredData.map(c => ({ 'Менеджер': c.manager||'', 'Клиент': c.clientName||'', 'Телефон': c.phone||'', 'Дата/время': c.timestamp||'', 'Результат': c.interest||'', 'Причина отказа': c.reason||'', 'Комментарий': c.comment||'' }));
            const ws = XLSX.utils.json_to_sheet(exp); const wb = XLSX.utils.book_new(); XLSX.utils.book_append_sheet(wb, ws, 'Тукая'); XLSX.writeFile(wb, `Тукая_${new Date().toISOString().slice(0,10)}.xlsx`);
        };
    </script>
</body>
</html>
