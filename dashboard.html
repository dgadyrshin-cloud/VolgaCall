    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyC-YD6qkyRFo3xQTLkX68Tqx7xMb-ojNiM",

            appId: "1:608686730576:web:002b653cb7ffa7b3381055"
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();
        const CORRECT_PASSWORD = '080888';
        if (sessionStorage.getItem('dashboard_authenticated') === 'true') showDashboard();
        document.getElementById('password-submit').addEventListener('click', checkPassword);
        document.getElementById('password-input').addEventListener('keydown', e => { if (e.key === 'Enter') checkPassword(); });
        function checkPassword() {
            if (document.getElementById('password-input').value === CORRECT_PASSWORD) {
                sessionStorage.setItem('dashboard_authenticated', 'true');
                showDashboard();
            } else {
                document.getElementById('password-error').textContent = '❌ Неверный пароль';
                document.getElementById('password-input').value = '';
            }
        }
        function showDashboard() {
            document.getElementById('password-overlay').style.display = 'none';
            document.getElementById('dashboard-content').style.display = 'block';
            lucide.createIcons();
            initDashboard();
        }

        const departments = {
            tukaya: ['Артем', 'Руслан', 'Алия', 'Айнур'],
            gareeva: ['Аделина', 'Альзам', 'Санжар', 'Яна', 'Булат'],
            senior: ['Александр', 'Альфинур']
        };
        const allManagers = [...departments.tukaya, ...departments.gareeva, ...departments.senior];

        let allData = [];
        let filteredData = [];
        let firstLoad = true;

        function applyFilters() {
            const dep = document.getElementById('filter-department').value;
            const mgr = document.getElementById('filter-manager').value;
            const dateFrom = document.getElementById('filter-date-from').value;
            const dateTo = document.getElementById('filter-date-to').value;

            filteredData = allData.filter(call => {
                if (dep && !departments[dep]?.includes(call.manager)) return false;
                if (mgr && call.manager !== mgr) return false;
                if (dateFrom || dateTo) {
                    const callDate = parseTimestamp(call.timestamp);
                    if (dateFrom && callDate < new Date(dateFrom)) return false;
                    if (dateTo) {
                        const toDate = new Date(dateTo);
                        toDate.setHours(23,59,59,999);
                        if (callDate > toDate) return false;
                    }
                }
                return true;
            });
            render();
        }

        function parseTimestamp(ts) {
            if (!ts) return new Date(0);
            // Формат: "29.07.2026 14:30"
            const parts = ts.match(/(\d{2})\.(\d{2})\.(\d{4}) (\d{2}):(\d{2})/);
            if (parts) return new Date(+parts[3], +parts[2]-1, +parts[1], +parts[4], +parts[5]);
            // Если без времени: "29.07.2026"
            const parts2 = ts.match(/(\d{2})\.(\d{2})\.(\d{4})/);
            if (parts2) return new Date(+parts2[3], +parts2[2]-1, +parts2[1]);
            const d = new Date(ts);
            return isNaN(d.getTime()) ? new Date(0) : d;
        }

        function updateManagerSelect() {
            const dep = document.getElementById('filter-department').value;
            const mgrSelect = document.getElementById('filter-manager');
            mgrSelect.innerHTML = '<option value="">Все менеджеры</option>';
            if (dep) {
                departments[dep].forEach(m => {
                    mgrSelect.innerHTML += `<option value="${m}">${m}</option>`;
                });
            } else {
                allManagers.forEach(m => {
                    mgrSelect.innerHTML += `<option value="${m}">${m}</option>`;
                });
            }
        }

        function initDashboard() {
            // Сначала показываем кеш
            const cached = localStorage.getItem('vb_dash_cache');
            if (cached) {
                allData = JSON.parse(cached);
                applyFilters();
                document.getElementById('loading-indicator').style.display = 'none';
            }

            const callsRef = db.ref('calls');
            callsRef.on('value', snapshot => {
                const data = snapshot.val();
                allData = data ? Object.values(data) : [];
                console.log('Загружено звонков:', allData.length);
                applyFilters();
                localStorage.setItem('vb_dash_cache', JSON.stringify(allData));
                document.getElementById('loading-indicator').style.display = 'none';
                document.getElementById('update-time').textContent = '🟢 ' + new Date().toLocaleTimeString('ru-RU');
            }, err => {
                console.error('Ошибка Firebase:', err);
                if (firstLoad && !cached) {
                    document.getElementById('loading-indicator').innerHTML = '<span class="text-destructive">Ошибка загрузки данных</span>';
                }
                document.getElementById('update-time').textContent = '🔴 Офлайн';
            });

            firstLoad = false;

            document.getElementById('filter-department').addEventListener('change', () => {
                updateManagerSelect();
                applyFilters();
            });
            document.getElementById('filter-manager').addEventListener('change', applyFilters);
            document.getElementById('filter-date-from').addEventListener('change', applyFilters);
            document.getElementById('filter-date-to').addEventListener('change', applyFilters);
            document.getElementById('btn-reset-filters').addEventListener('click', () => {
                document.getElementById('filter-department').value = '';
                document.getElementById('filter-manager').value = '';
                document.getElementById('filter-date-from').value = '';
                document.getElementById('filter-date-to').value = '';
                updateManagerSelect();
                applyFilters();
            });
            updateManagerSelect();
        }

        function render() {
            const total = filteredData.length,
                interested = filteredData.filter(c => c.interest === 'интересно').length,
                buying = filteredData.filter(c => c.interest === 'покупают').length,
                notInterested = filteredData.filter(c => c.interest === 'не интересно').length;
            document.getElementById('total').textContent = total;
            document.getElementById('yes').textContent = interested;
            document.getElementById('buy').textContent = buying;
            document.getElementById('no').textContent = notInterested;

            const managers = {};
            filteredData.forEach(c => {
                const m = c.manager || 'Неизвестный';
                if (!managers[m]) managers[m] = { total:0, interested:0, buying:0, not:0 };
                managers[m].total++;
                if (c.interest === 'интересно') managers[m].interested++;
                else if (c.interest === 'покупают') managers[m].buying++;
                else if (c.interest === 'не интересно') managers[m].not++;
            });
            let html = '';
            Object.entries(managers).sort((a,b) => b[1].total - a[1].total).forEach(([name, s]) => {
                const c = s.total ? Math.round(((s.interested + s.buying) / s.total) * 100) : 0;
                html += `<tr class="border-b hover:bg-muted/30"><td class="py-2 px-3 font-medium">${name}</td><td class="text-center py-2">${s.total}</td><td class="text-center text-emerald-600">${s.interested}</td><td class="text-center text-blue-600">${s.buying}</td><td class="text-center text-destructive">${s.not}</td><td class="text-center">${c}%</td></tr>`;
            });
            document.getElementById('by-manager').innerHTML = html || '<tr><td colspan="6" class="text-center text-muted-foreground py-4">Нет данных</td></tr>';

            const reasons = {};
            filteredData.filter(c => c.interest === 'не интересно').forEach(c => { const r = c.reason || 'Не указана'; reasons[r] = (reasons[r] || 0) + 1; });
            let rh = '<table class="w-full text-sm"><tr class="border-b bg-muted/50"><th class="text-left py-2 px-3">Причина</th><th class="text-center py-2 px-3">Кол-во</th><th class="text-center py-2 px-3">Доля</th></tr>';
            Object.entries(reasons).sort((a,b) => b[1] - a[1]).forEach(([r, cnt]) => {
                const share = notInterested ? Math.round((cnt / notInterested) * 100) : 0;
                rh += `<tr class="border-b"><td class="py-2 px-3">${r}</td><td class="text-center">${cnt}</td><td class="text-center">${share}%</td></tr>`;
            });
            rh += '</table>';
            document.getElementById('by-reason').innerHTML = rh || '<p class="text-muted-foreground text-center py-2">Нет данных</p>';

            const recent = [...filteredData].reverse().slice(0, 50);
            let rth = '<table class="w-full text-sm"><tr class="border-b bg-muted/50"><th class="text-left py-2 px-3">Время</th><th class="text-left py-2 px-3">Менеджер</th><th class="text-left py-2 px-3">Клиент</th><th class="text-left py-2 px-3">Телефон</th><th class="text-left py-2 px-3">Результат</th><th class="text-left py-2 px-3">Комментарий</th></tr>';
            recent.forEach(c => {
                let result = c.interest === 'интересно' ? '✅ Интересно' : (c.interest === 'покупают' ? '🛒 Покупают' : '❌ ' + (c.reason || 'Не интересно'));
                rth += `<tr class="border-b hover:bg-muted/30"><td class="py-2 px-3 text-xs">${c.timestamp||''}</td><td class="py-2 px-3">${c.manager||''}</td><td class="py-2 px-3">${c.clientName||''}</td><td class="py-2 px-3">${c.phone||''}</td><td class="py-2 px-3">${result}</td><td class="py-2 px-3 text-muted-foreground">${c.comment||''}</td></tr>`;
            });
            rth += '</table>';
            document.getElementById('recent').innerHTML = rth || '<p class="text-muted-foreground text-center py-2">Нет данных</p>';
        }

        window.resetAllStats = function() {
            if (confirm('Удалить ВСЕ записи звонков всех менеджеров?')) {
                if (confirm('Подтвердите: удалить все данные?')) {
                    db.ref('calls').remove()
                        .then(() => db.ref('reset/timestamp').set(firebase.database.ServerValue.TIMESTAMP))
                        .then(() => { allData = []; filteredData = []; render(); alert('Статистика сброшена.'); })
                        .catch(err => alert('Ошибка: ' + err.message));
                }
            }
        };
        window.exportExcel = function() {
            if (!filteredData.length) { alert('Нет данных'); return; }
            const exp = filteredData.map(c => ({ 'Менеджер': c.manager||'', 'Клиент': c.clientName||'', 'Телефон': c.phone||'', 'Дата/время': c.timestamp||'', 'Результат': c.interest||'', 'Причина отказа': c.reason||'', 'Комментарий': c.comment||'' }));
            const ws = XLSX.utils.json_to_sheet(exp);
            const wb = XLSX.utils.book_new();
            XLSX.utils.book_append_sheet(wb, ws, 'Звонки');
            XLSX.writeFile(wb, `ВолгаБрик_${new Date().toISOString().slice(0,10)}.xlsx`);
        };
    </script>
</body>
</html>
