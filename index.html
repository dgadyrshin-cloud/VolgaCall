<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Волга Брик — Система обзвона</title>
    <link rel="manifest" href="/VolgaCall/manifest.json">
    <meta name="theme-color" content="#1a237e">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Волга Брик">
    <link rel="apple-touch-icon" href="/VolgaCall/icons/icon-192.png">
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
        }
        .container {
            background: white;
            padding: 40px;
            border-radius: 16px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
            text-align: center;
            max-width: 500px;
            width: 90%;
        }
        h1 { color: #2c3e50; margin-bottom: 10px; }
        p { color: #666; margin-bottom: 30px; }
        .btn {
            display: block;
            padding: 15px 30px;
            margin: 10px 0;
            text-decoration: none;
            border-radius: 10px;
            font-size: 1.1rem;
            font-weight: 600;
            transition: 0.2s;
        }
        .btn-manager { background: #3949ab; color: white; }
        .btn-dashboard { background: #1e824c; color: white; }
        .btn-rop { background: #6a1b9a; color: white; }
        .btn:hover { transform: translateY(-2px); box-shadow: 0 5px 15px rgba(0,0,0,0.2); }
    </style>
</head>
<body>
    <div class="container">
        <h1>🏭 Волга Брик</h1>
        <p>Система обзвона клиентов</p>
        <a href="manager.html" class="btn btn-manager">📞 Вход для менеджеров</a>
        <a href="dashboard.html" class="btn btn-dashboard">📊 Дашборд руководителя</a>
        <a href="rop-tukaya.html" class="btn btn-rop">📋 РОП Тукая</a>
        <a href="rop-gareeva.html" class="btn btn-rop">📋 РОП Гареева</a>
    </div>
    <script>
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('/VolgaCall/sw.js')
                    .then(reg => console.log('SW ok', reg.scope))
                    .catch(err => console.log('SW err', err));
            });
        }
    </script>
</body>
</html>
