<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Волга Брик — Система обзвона</title>
    <link rel="manifest" href="/VolgaCall/manifest.json">
    <meta name="theme-color" content="#03c871">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Волга Брик">
    <link rel="apple-touch-icon" href="/VolgaCall/icons/icon-192.png">
    <link href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: { sans: ['Inter', 'ui-sans-serif', 'system-ui', '-apple-system', 'sans-serif'] },
                    colors: {
                        primary: { DEFAULT: "#03c871", foreground: "#ffffff" },
                        destructive: { DEFAULT: "#c62828", foreground: "#ffffff" },
                        muted: { DEFAULT: "#f4f4f5", foreground: "#71717a" },
                        card: { DEFAULT: "#ffffff", foreground: "#09090b" },
                        border: "#e4e4e7",
                        ring: "#03c871",
                    }
                }
            }
        }
    </script>
</head>
<body class="bg-gray-50 min-h-screen flex items-center justify-center p-4 font-sans antialiased">
    <div class="bg-card border rounded-xl shadow-sm p-8 max-w-md w-full text-center space-y-6">
        <div class="flex justify-center">
            <i data-lucide="factory" class="h-12 w-12 text-primary"></i>
        </div>
        <h1 class="text-2xl font-bold tracking-tight text-card-foreground">Волга Брик</h1>
        <p class="text-muted-foreground text-sm">Система обзвона клиентов</p>
        <div class="space-y-3">
            <a href="manager.html" class="flex items-center justify-center gap-2 rounded-md bg-primary text-primary-foreground hover:bg-primary/90 h-10 px-4 py-2 text-sm font-medium transition-colors">
                <i data-lucide="phone" class="h-4 w-4"></i> Вход для менеджеров
            </a>
            <a href="dashboard.html" class="flex items-center justify-center gap-2 rounded-md border border-input bg-background hover:bg-muted/50 h-10 px-4 py-2 text-sm font-medium transition-colors">
                <i data-lucide="layout-dashboard" class="h-4 w-4"></i> Дашборд руководителя
            </a>
            <a href="rop-tukaya.html" class="flex items-center justify-center gap-2 rounded-md border border-input bg-background hover:bg-muted/50 h-10 px-4 py-2 text-sm font-medium transition-colors">
                <i data-lucide="users" class="h-4 w-4"></i> РОП Тукая
            </a>
            <a href="rop-gareeva.html" class="flex items-center justify-center gap-2 rounded-md border border-input bg-background hover:bg-muted/50 h-10 px-4 py-2 text-sm font-medium transition-colors">
                <i data-lucide="users" class="h-4 w-4"></i> РОП Гареева
            </a>
        </div>
    </div>
    <script>
        lucide.createIcons();
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('/VolgaCall/sw.js')
                    .then(reg => console.log('SW ok', reg.scope))
                    .catch(err => console.log('SW err', err));
            });
        }
    </script>
</body>
</html>
