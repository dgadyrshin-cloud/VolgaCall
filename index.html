<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Волга Брик — Система обзвона</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
        }
        .container {
            background: white;
            padding: 40px;
            border-radius: 16px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
            text-align: center;
            max-width: 500px;
        }
        h1 { color: #2c3e50; margin-bottom: 10px; }
        p { color: #666; margin-bottom: 30px; }
        .btn {
            display: block;
            padding: 15px 30px;
            margin: 10px 0;
            text-decoration: none;
            border-radius: 10px;
            font-size: 1.1rem;
            font-weight: 600;
            transition: 0.2s;
        }
        .btn-manager { background: #3949ab; color: white; }
        .btn-dashboard { background: #1e824c; color: white; }
        .btn:hover { transform: translateY(-2px); box-shadow: 0 5px 15px rgba(0,0,0,0.2); }
    </style>
</head>
<body>
    <div class="container">
        <h1>🏭 Волга Брик</h1>
        <p>Система обзвона клиентов</p>
        <a href="manager.html" class="btn btn-manager">📞 Вход для менеджеров</a>
        <a href="dashboard.html" class="btn btn-dashboard">📊 Дашборд руководителя</a>
    </div>
</body>
</html>
